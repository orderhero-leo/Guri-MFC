<script>
var map = L.map('map').setView([37.65,127.2], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

function fillColor(s){ return (s === '활성화') ? '#20a120' : '#e23b3b'; }
function styleFn(status){
  return function(f){
    return { color: '#444', weight: 1.5, fillColor: fillColor(status), fillOpacity: (status==='활성화') ? 0.35 : 0.25 };
  };
}

var onLayer = L.geoJSON(null, { style: styleFn('활성화'), onEachFeature: onEach });
var offLayer = L.geoJSON(null, { style: styleFn('비활성화'), onEachFeature: onEach });

function onEach(feature, layer){
  var p = feature.properties || {};
  var name = p.EMD_NM || '';
  var code = p.EMD_CD || '';
  var status = p.status || '';
  var html = '<div><b>'+name+'</b> ('+code+')<br/>상태: '+status+'</div>';
  layer.bindTooltip('<b>'+name+'</b>', {permanent:true, direction:'center', className:'label'});
  layer.bindPopup(html);
}

(DATA.features || []).forEach(function(ft){
  var s = (ft.properties && ft.properties.status) || '비활성화';
  if(s === '활성화') onLayer.addData(ft); else offLayer.addData(ft);
});

onLayer.addTo(map);
offLayer.addTo(map);

try {
  var b = L.featureGroup([onLayer, offLayer]).getBounds();
  if(b.isValid()) map.fitBounds(b, {padding:[12,12]});
} catch(e) {}

var legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  var div = L.DomUtil.create('div','legend');
  div.innerHTML = '<div><i style="background:#20a120"></i>활성화</div><div><i style="background:#e23b3b"></i>비활성화</div>';
  return div;
};
legend.addTo(map);

document.getElementById('showOn').addEventListener('change', function(e){
  if(e.target.checked) map.addLayer(onLayer); else map.removeLayer(onLayer);
});
document.getElementById('showOff').addEventListener('change', function(e){
  if(e.target.checked) map.addLayer(offLayer); else map.removeLayer(offLayer);
});

function doSearch(){
  var q = (document.getElementById('search').value || '').trim();
  if(!q) return;
  var found = null;
  function scan(layer){
    layer.eachLayer(function(l){
      if(found) return;
      var nm = (l.feature && l.feature.properties && l.feature.properties.EMD_NM) || '';
      if(nm.indexOf(q) >= 0) found = l;
    });
  }
  scan(onLayer); scan(offLayer);
  if(found){
    map.fitBounds(found.getBounds(), {padding:[20,20]});
    found.openPopup();
  } else {
    alert('결과 없음: '+q);
  }
}
document.getElementById('btnSearch').addEventListener('click', doSearch);
document.getElementById('search').addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });
</script>
